<!DOCTYPE html>
<html lang="zh-CN" data-page="home">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#EDEDEB">
<meta name="description" content="Finora AI 个人记账与消费分析交互预览">
<title>Finora AI · 校园账本</title>

<link rel="stylesheet" href="./assets/css/app.css">
<script src="./assets/js/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="桌面导航">
    <div class="brand" id="brand"></div>
    <p class="nav-caption">我的账本</p>
    <nav class="navlinks" id="desktop-nav" aria-label="账本页面"></nav>
    <div class="side-bottom">
      <div id="finora-mascot-eye-glint">
  <div class="finora-stage">
    <button type="button" class="finora-mascot" aria-label="小账单，点击眨眼并轻跳">
      <span class="finora-art" aria-hidden="true">
        <img src="./assets/images/finora-mascot.webp" width="740" height="740" alt="">
        <span class="finora-gaze">
          <span class="finora-eye finora-eye-left"><span class="finora-lid"><span class="finora-highlight"></span></span></span>
          <span class="finora-eye finora-eye-right"><span class="finora-lid"><span class="finora-highlight"></span></span></span>
        </span>
      </span>
    </button>
  </div>
</div>
      <button type="button" class="navbtn" data-action="settings" id="settings-link" aria-label="账本设置"></button>
      <div class="profile"><span class="account-mark" id="account-mark" aria-hidden="true"></span><div><strong>个人账本</strong><small>Finora AI</small></div></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div class="top-inner"><div class="crumb" id="crumb"></div><div class="top-actions"><button class="iconbtn" id="help" type="button" data-action="settings" aria-label="个人账本设置"></button></div></div></header>
    <main id="view" class="frame" tabindex="-1"></main>
  </div>
</div>
<nav class="bottom-nav" id="mobile-nav" aria-label="移动端导航"></nav>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="finora-pointer" id="finora-pointer" aria-hidden="true"></div>

</body>
</html>
